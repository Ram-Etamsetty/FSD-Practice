<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Results</title>
  </head>
  <body>
    <header>
      <h1>Election Results</h1>
    </header>

    <main>
      <section>
        <h2>President Election</h2>

        <h3>Winner: Rahul Sharma 🏆</h3>

        <table border="1">
          <thead>
            <tr>
              <th>Candidate</th>
              <th>Votes</th>
              <th>Percentage</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Rahul Sharma</td>
              <td>120</td>
              <td>60%</td>
            </tr>

            <tr>
              <td>Priya Verma</td>
              <td>80</td>
              <td>40%</td>
            </tr>
          </tbody>
        </table>

        <h3>Vote Percentage</h3>

        <p>Rahul Sharma</p>
        <progress value="60" max="100"></progress>

        <p>Priya Verma</p>
        <progress value="40" max="100"></progress>
      </section>
    </main>
  </body>
</html>
